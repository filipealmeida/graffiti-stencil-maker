name: stencil

on:
  push:
    branches: [main]
    paths: ["Cargo.toml", "Cargo.lock", "crates/**", "web/**", "README.md", "INSTALL.md", "USAGE.md", ".github/workflows/**"]
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", "crates/**", "web/**", "README.md", "INSTALL.md", "USAGE.md", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: cargo test --release --workspace
      - name: CLI smoke test
        run: |
          cargo build --release -p stencil-cli
          printf '<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"><rect width="60" height="60" fill="white"/><circle cx="30" cy="30" r="18" fill="none" stroke="black" stroke-width="6"/></svg>' > ring.svg
          ./target/release/stencil ring.svg --thickness 2 -o ring.stl
          test -s ring.stl

  web:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - name: Build wasm
        working-directory: crates/stencil-wasm
        run: wasm-pack build --release --target web --out-dir ../../web/pkg
      - name: Build studio
        working-directory: web
        run: npm ci && npm audit --audit-level=high && npm run build
      - name: Build single-binary studio
        run: cargo build --release -p stencil-cli --features studio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
