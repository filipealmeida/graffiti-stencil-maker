name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # A tag only ships if the engine's tests pass; the browser tests run in ci.yml.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --workspace

  build:
    needs: verify
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64, exe: stencil, launcher: stencil-studio }
          - { os: macos-latest, name: macos-arm64, exe: stencil, launcher: stencil-studio }
          - { os: windows-latest, name: windows-x64, exe: stencil.exe, launcher: stencil-studio.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build wasm
        working-directory: crates/stencil-wasm
        run: wasm-pack build --release --target web --out-dir ../../web/pkg
      - name: Build threaded wasm (optional)
        working-directory: crates/stencil-wasm
        run: |
          RUSTFLAGS='-C target-feature=+atomics,+bulk-memory,+mutable-globals -C link-args=--shared-memory -C link-args=--import-memory -C link-args=--max-memory=4294967296 -C link-args=--export=__wasm_init_tls -C link-args=--export=__tls_size -C link-args=--export=__tls_align -C link-args=--export=__tls_base' \
          rustup run nightly wasm-pack build --release --target web --out-dir ../../web/public/pkg-mt --out-name stencil_wasm -- --features threads -Z build-std=panic_abort,std || true
      - name: Patch threaded worker helper
        working-directory: web
        run: node scripts/patch-mt-worker.mjs
      - name: Build studio
        working-directory: web
        run: npm ci && npm run build
      - name: Build binary
        run: cargo build --release -p stencil-cli --features studio -p stencil-launcher
      - name: Package
        shell: bash
        run: |
          mkdir out
          cp target/release/${{ matrix.exe }} target/release/${{ matrix.launcher }} out/
          cp README.md INSTALL.md USAGE.md LICENSE out/
          cd out && 7z a ../stencil-${{ matrix.name }}.zip . > /dev/null
      - uses: softprops/action-gh-release@v2
        with:
          files: stencil-${{ matrix.name }}.zip
