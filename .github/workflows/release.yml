name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64, exe: stencil }
          - { os: macos-latest, name: macos-arm64, exe: stencil }
          - { os: windows-latest, name: windows-x64, exe: stencil.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build wasm
        working-directory: crates/stencil-wasm
        run: wasm-pack build --release --target web --out-dir ../../web/pkg
      - name: Build studio
        working-directory: web
        run: npm ci && npm run build
      - name: Build binary
        run: cargo build --release -p stencil-cli --features studio
      - name: Package
        shell: bash
        run: |
          mkdir out
          cp target/release/${{ matrix.exe }} out/
          cp README.md INSTALL.md USAGE.md LICENSE out/
          cd out && 7z a ../stencil-${{ matrix.name }}.zip . > /dev/null
      - uses: softprops/action-gh-release@v2
        with:
          files: stencil-${{ matrix.name }}.zip
