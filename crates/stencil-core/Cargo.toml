[package]
name = "stencil-core"
version = "2.9.3"
edition = "2021"

[dependencies]
boolmesh = "0.2"
i_triangle = "0.49.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
serde_json = "1"
resvg = { version = "0.48", default-features = false }
fontdue = { version = "0.9", default-features = false }
rayon = { version = "1", optional = true }

[features]
# A worker pool in the browser build (needs shared memory); native builds always have threads.
threads = ["dep:rayon"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"
