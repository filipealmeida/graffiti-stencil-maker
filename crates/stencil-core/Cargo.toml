[package]
name = "stencil-core"
version = "0.1.0"
edition = "2021"

[dependencies]
boolmesh = "0.2"
i_triangle = "0.49.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
serde_json = "1"
resvg = { version = "0.48", default-features = false }
fontdue = { version = "0.9", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"
