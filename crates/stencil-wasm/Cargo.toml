[package]
name = "stencil-wasm"
version = "2.9.1"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
stencil-core = { path = "../stencil-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde_json = "1"
wasm-bindgen-rayon = { version = "1.3", optional = true }

[features]
# Multi-threaded build: needs nightly Rust, build-std and atomics (see INSTALL.md).
threads = ["stencil-core/threads", "dep:wasm-bindgen-rayon"]
